apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: epochclusters.platform.epoch.dev
spec:
  group: platform.epoch.dev
  scope: Namespaced
  names:
    plural: epochclusters
    singular: epochcluster
    kind: EpochCluster
    listKind: EpochClusterList
    shortNames: [epoch]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Ready
          type: integer
          jsonPath: .status.readyNodes
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - nodeImage
                - controlImage
                - replicas
                - storage
                - authPolicyConfigMap
                - credentialSecret
              properties:
                nodeImage:
                  type: string
                  minLength: 1
                controlImage:
                  type: string
                  minLength: 1
                region:
                  type: string
                  minLength: 1
                  default: local
                nodeClass:
                  type: string
                  minLength: 1
                  default: general-purpose
                replicas:
                  type: integer
                  format: int32
                  minimum: 3
                  maximum: 3
                storage:
                  anyOf:
                    - type: integer
                    - type: string
                  x-kubernetes-int-or-string: true
                  pattern: ^([0-9]+)([EPTGMK]i?|m)?$
                storageClassName:
                  type: string
                authPolicyConfigMap:
                  type: string
                  minLength: 1
                credentialSecret:
                  type: string
                  minLength: 1
                serviceType:
                  type: string
                  enum: [ClusterIP, NodePort, LoadBalancer]
                  default: ClusterIP
                allowedOrigins:
                  type: array
                  maxItems: 64
                  items:
                    type: string
                nodeResources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                controlResources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                tolerations:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                affinity:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                readyNodes:
                  type: integer
                  format: int32
                controlReady:
                  type: boolean
                endpoint:
                  type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
