apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: epochclusters.platform.epoch.dev
spec:
  group: platform.epoch.dev
  scope: Namespaced
  names:
    plural: epochclusters
    singular: epochcluster
    kind: EpochCluster
    listKind: EpochClusterList
    shortNames: [epoch]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Ready
          type: integer
          jsonPath: .status.readyNodes
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
        - name: Upgrade
          type: string
          jsonPath: .status.upgrade.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - nodeImage
                - controlImage
                - replicas
                - storage
                - authPolicyConfigMap
                - credentialSecret
                - transportSecurity
                - backup
              properties:
                nodeImage:
                  type: string
                  minLength: 1
                controlImage:
                  type: string
                  minLength: 1
                region:
                  type: string
                  minLength: 1
                  default: local
                nodeClass:
                  type: string
                  minLength: 1
                  default: general-purpose
                replicas:
                  type: integer
                  format: int32
                  minimum: 3
                  maximum: 1024
                catalogReplicas:
                  type: integer
                  format: int32
                  default: 3
                  enum:
                    - 3
                    - 5
                storage:
                  anyOf:
                    - type: integer
                    - type: string
                  x-kubernetes-int-or-string: true
                  pattern: ^([0-9]+)([EPTGMK]i?|m)?$
                storageClassName:
                  type: string
                authPolicyConfigMap:
                  type: string
                  minLength: 1
                credentialSecret:
                  type: string
                  minLength: 1
                transportSecurity:
                  type: object
                  required:
                    - dataPlaneSecret
                    - controlPlaneSecret
                    - regionalServerName
                  properties:
                    dataPlaneSecret:
                      type: string
                      minLength: 1
                    controlPlaneSecret:
                      type: string
                      minLength: 1
                    regionalServerName:
                      type: string
                      minLength: 1
                backup:
                  type: object
                  required: [schedule, destinationPVC, encryptionSecret, keyID, retentionCount]
                  properties:
                    schedule:
                      type: string
                      minLength: 1
                      maxLength: 128
                    destinationPVC:
                      type: string
                      minLength: 1
                    encryptionSecret:
                      type: string
                      minLength: 1
                    keyID:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                    retentionCount:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 10000
                restore:
                  type: object
                  required: [objectName, encryptionSecret]
                  properties:
                    objectName:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*\.epoch-backup\.enc$
                    encryptionSecret:
                      type: string
                      minLength: 1
                upgrade:
                  type: object
                  properties:
                    backupMaxAgeSeconds:
                      type: integer
                      format: int64
                      minimum: 60
                      maximum: 604800
                      default: 3600
                    stepDeadlineSeconds:
                      type: integer
                      format: int64
                      minimum: 30
                      maximum: 86400
                      default: 900
                    rollbackOnFailure:
                      type: boolean
                      default: true
                    retryToken:
                      type: string
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                serviceType:
                  type: string
                  enum: [ClusterIP, NodePort, LoadBalancer]
                  default: ClusterIP
                allowedOrigins:
                  type: array
                  maxItems: 64
                  items:
                    type: string
                nodeResources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                controlResources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                tolerations:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                affinity:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                readyNodes:
                  type: integer
                  format: int32
                controlReady:
                  type: boolean
                endpoint:
                  type: string
                initialized:
                  type: boolean
                restoreObject:
                  type: string
                restoreEncryptionSecret:
                  type: string
                backup:
                  type: object
                  properties:
                    observedSchedule:
                      type: string
                    lastSuccessfulTime:
                      type: string
                      format: date-time
                    lastSuccessfulObject:
                      type: string
                    lastManifestSHA256:
                      type: string
                    lastKeyID:
                      type: string
                    lastFailureTime:
                      type: string
                      format: date-time
                    lastFailureMessage:
                      type: string
                    retainedObjects:
                      type: integer
                      format: int32
                upgrade:
                  type: object
                  properties:
                    currentNodeImage:
                      type: string
                    targetNodeImage:
                      type: string
                    requestID:
                      type: string
                    phase:
                      type: string
                      enum:
                        - Stable
                        - WaitingForBackup
                        - Preflight
                        - Draining
                        - Updating
                        - Verifying
                        - RollbackPreflight
                        - RollbackDraining
                        - RollbackUpdating
                        - RollbackVerifying
                        - Failed
                    targetOrdinal:
                      type: integer
                      format: int32
                      minimum: 0
                    startedAt:
                      type: string
                      format: date-time
                    stepStartedAt:
                      type: string
                      format: date-time
                    failureMessage:
                      type: string
                    message:
                      type: string
                    updatedNodes:
                      type: integer
                      format: int32
                      minimum: 0
                    targetOrdinalUpdated:
                      type: boolean
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
