apiVersion: v1
kind: ServiceAccount
metadata:
  name: epoch-operator
  namespace: epoch-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: epoch-operator
rules:
  - apiGroups: [platform.epoch.dev]
    resources: [epochclusters]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [platform.epoch.dev]
    resources: [epochclusters/status]
    verbs: [get, update, patch]
  - apiGroups: [platform.epoch.dev]
    resources: [epochclusters/finalizers]
    verbs: [update]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps, secrets, persistentvolumeclaims, pods]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: epoch-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: epoch-operator
subjects:
  - kind: ServiceAccount
    name: epoch-operator
    namespace: epoch-system
