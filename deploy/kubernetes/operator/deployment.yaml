apiVersion: v1
kind: Namespace
metadata:
  name: epoch-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epoch-operator
  namespace: epoch-system
  labels:
    app.kubernetes.io/name: epoch-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: epoch-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epoch-operator
    spec:
      serviceAccountName: epoch-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/ripan-roy/epoch-operator:v0.2.0-beta.2
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: epoch-operator
