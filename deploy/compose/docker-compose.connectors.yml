name: epoch-connector-conformance

services:
  object-store:
    image: ghcr.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    environment:
      AWS_ACCESS_KEY_ID: epoch-access
      AWS_SECRET_ACCESS_KEY: epoch-secret-key
      S3_BUCKET: events
    ports:
      - "127.0.0.1:19000:8333"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:17.5
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_PASSWORD: epoch-root-password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ../../tests/fixtures/connectors/postgres-init.sql:/docker-entrypoint-initdb.d/10-epoch.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d epoch_connectors"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql:
    image: mysql:8.4.5
    command:
      - --server-id=101
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    environment:
      MYSQL_ROOT_PASSWORD: epoch-root-password
      MYSQL_DATABASE: epoch_connectors
      MYSQL_USER: epoch_replication
      MYSQL_PASSWORD: epoch-replication-password
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ../../tests/fixtures/connectors/mysql-init.sql:/docker-entrypoint-initdb.d/10-epoch.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -pepoch-root-password --silent",
        ]
      interval: 2s
      timeout: 3s
      retries: 40

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
