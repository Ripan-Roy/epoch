version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-patch]
  - package-ecosystem: gomod
    directory: /
    # Reserve one PR slot for the Kubernetes release line and one for the
    # ordinary Go graph so an API migration cannot starve routine updates.
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
      day: tuesday
      time: "02:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    groups:
      kubernetes-release-line:
        applies-to: version-updates
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
        update-types: [minor, patch]
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
      day: wednesday
      time: "02:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: pip
    directory: /sdk/python
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
      day: thursday
      time: "02:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: maven
    # Keep SDK and protocol-test clients in the same weekly Maven group.
    directories:
      - /sdk/java
      - /tests/compatibility/java
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
      day: friday
      time: "02:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
      day: saturday
      time: "02:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
