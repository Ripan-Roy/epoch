name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deployment' }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and package documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VITE_BASE_PATH: /epoch/
      VITE_DEFAULT_PAGE: docs
      VITE_DOCS_ONLY: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pinned Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          test "$(pnpm --version)" = "10.28.0"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm --filter @epoch/console format:check

      - name: Lint
        run: pnpm --filter @epoch/console lint

      - name: Type-check
        run: pnpm --filter @epoch/console typecheck

      - name: Build for project Pages
        run: pnpm --filter @epoch/console build

      - name: Verify Pages base path
        run: |
          test -f console/dist/index.html
          grep -Eq '(src|href)="/epoch/' console/dist/index.html
          grep -Rq 'One lifecycle, three real clients' console/dist/assets
          grep -Rq 'Experimental replicated Queue' console/dist/assets
          grep -Rq 'Experimental replicated Event Bus' console/dist/assets
          grep -Rq 'per-subscription outbox leases' console/dist/assets
          grep -Rq 'One catalog materializes four profile-specific groups' console/dist/assets
          grep -Rq 'Checkpoint progress and ownership fences survive leader and process loss' console/dist/assets
          grep -Rq 'Route keys and coordinate consumers across replicated partitions' console/dist/assets
          grep -Rq 'fnv1a64_utf8_mod_n_v1' console/dist/assets
          grep -Rq 'docs-go-keyed-stream-v1' console/dist/assets
          grep -Rq 'docs-java-keyed-stream-v1' console/dist/assets
          grep -Rq 'docs-python-keyed-stream-v1' console/dist/assets
          grep -Rq 'docs-python-checkpoint-v1' console/dist/assets
          grep -Rq 'docs-python-retention-v1' console/dist/assets
          grep -Rq 'docs-go-session-join-v1' console/dist/assets
          grep -Rq 'docs-java-session-join-v1' console/dist/assets
          grep -Rq 'docs-python-session-join-v1' console/dist/assets
          grep -Rq 'docs-go-gzip-batch-v1' console/dist/assets
          grep -Rq 'docs-java-gzip-batch-v1' console/dist/assets
          grep -Rq 'docs-python-gzip-batch-v1' console/dist/assets
          grep -Rq 'Client-framed atomic batches preserve exact bytes' console/dist/assets
          grep -Rq 'Replicated membership and assignment' console/dist/assets
          grep -Rq 'Regional atomic batch clients' console/dist/assets
          grep -Rq 'Only the current Raft leader owns each due timer' console/dist/assets
          grep -Rq 'Leader-owned automatic maintenance' console/dist/assets
          grep -Rq 'Every voter bounds its local journal' console/dist/assets
          grep -Rq 'Claim, revalidate, then consume' console/dist/assets
          grep -Rq 'docs-python-session-claim-v1' console/dist/assets
          grep -Rq 'claim_consumer_session' console/dist/assets
          grep -Rq 'adr/0029-stream-session-fenced-consumption.md' console/dist/assets
          grep -Rq 'Replicated time and size retention' console/dist/assets
          grep -Rq 'Regional Stream SDK' console/dist/assets
          grep -Rq 'Regional Queue SDK' console/dist/assets
          grep -Rq 'Lease, retry, dead-letter, redrive, and settle' console/dist/assets
          grep -Rq 'docs-python-redrive-v1' console/dist/assets
          grep -Rq 'Regional Cache SDK' console/dist/assets
          grep -Rq 'CAS, transaction, fencing, expiry, and recovery' console/dist/assets
          grep -Rq 'docs-python-cache-maintain-v1' console/dist/assets
          grep -Rq 'Regional Event Bus SDK' console/dist/assets
          grep -Rq 'deliver signed webhooks, verify receivers' console/dist/assets
          grep -Rq 'docs-python-bus-ack-v1' console/dist/assets
          grep -Rq 'Receive and verify a signed webhook' console/dist/assets
          grep -Rq 'VerifyWebhookSignature' console/dist/assets
          grep -Rq 'WebhookSignatures.verify' console/dist/assets
          grep -Rq 'verify_webhook_signature' console/dist/assets
          grep -Rq 'EPOCH_REGIONAL_WEBHOOK_SIGNING_KEYS_PATH' console/dist/assets
          grep -Rq 'adr/0030-leader-owned-signed-webhook-delivery.md' console/dist/assets
          grep -Rq 'Checkpoint, compact, catch up, and reopen' console/dist/assets
          grep -Rq 'retained_log_first_index' console/dist/assets
          grep -Rq 'Multi-tablet operations' console/dist/assets
          release_version="$(cat VERSION)"
          grep -RFq "v${release_version} release notes" console/dist/assets
          if grep -Eq '(src|href)="/assets/' console/dist/index.html; then
            echo 'build contains an asset URL outside /epoch/' >&2
            exit 1
          fi
          if grep -RqE '/healthz|Refresh node' console/dist/assets; then
            echo 'docs-only build contains the live console runtime' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: console/dist

  docs-quickstarts:
    name: Execute displayed SDK quickstarts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Set up pinned Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum

      - name: Set up supported Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Set up pinned Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: sdk/java/pom.xml

      - name: Execute the exact published source
        run: bash tests/integration/docs-quickstarts.sh

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, docs-quickstarts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
