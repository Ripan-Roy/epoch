name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deployment' }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and package documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VITE_BASE_PATH: /epoch/
      VITE_DEFAULT_PAGE: docs
      VITE_DOCS_ONLY: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          test "$(pnpm --version)" = "10.28.0"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm --filter @epoch/console format:check

      - name: Lint
        run: pnpm --filter @epoch/console lint

      - name: Type-check
        run: pnpm --filter @epoch/console typecheck

      - name: Build for project Pages
        run: pnpm --filter @epoch/console build

      - name: Verify Pages base path
        run: |
          assert_bundle_contains() {
            local marker="$1"
            if ! grep -RFq --include='*.js' --include='*.css' -- "$marker" console/dist/assets; then
              echo "docs bundle missing required marker: ${marker}" >&2
              exit 1
            fi
          }

          test -f console/dist/index.html
          grep -Eq '(src|href)="/epoch/' console/dist/index.html
          assert_bundle_contains 'Create a durable Stream and Work Queue'
          assert_bundle_contains 'Experimental replicated Queue'
          assert_bundle_contains 'Experimental replicated Event Bus'
          assert_bundle_contains 'rate and retention, outbox leases, managed target execution'
          assert_bundle_contains 'One Catalog assigns independent three- or five-voter profile groups across N physical nodes'
          assert_bundle_contains 'Resource governance'
          assert_bundle_contains 'New managed resources fail closed without governance.'
          assert_bundle_contains 'cost_center=cc-1042'
          assert_bundle_contains 'adr/0033-resource-governance-and-cost-attribution.md'
          assert_bundle_contains 'usage metering, invoicing, or a billing ledger'
          assert_bundle_contains 'Checkpoint progress and ownership fences survive leader and process loss'
          assert_bundle_contains 'Build fenced producers, transactions, compaction, tiering, automatic capture, replication, and logical superstreams'
          assert_bundle_contains 'fnv1a64_utf8_mod_n_v1'
          assert_bundle_contains 'docs-go-keyed-stream-v1'
          assert_bundle_contains 'docs-java-keyed-stream-v1'
          assert_bundle_contains 'docs-python-keyed-stream-v1'
          assert_bundle_contains 'docs-python-checkpoint-v1'
          assert_bundle_contains 'docs-python-retention-v1'
          assert_bundle_contains 'docs-go-session-join-v1'
          assert_bundle_contains 'docs-java-session-join-v1'
          assert_bundle_contains 'docs-python-session-join-v1'
          assert_bundle_contains 'docs-go-gzip-batch-v1'
          assert_bundle_contains 'docs-java-gzip-batch-v1'
          assert_bundle_contains 'docs-python-gzip-batch-v1'
          assert_bundle_contains 'Client-framed atomic batches preserve exact bytes'
          assert_bundle_contains 'Replicated membership and assignment'
          assert_bundle_contains 'Regional atomic batch clients'
          assert_bundle_contains 'Only the current Raft leader owns each due timer'
          assert_bundle_contains 'Leader-owned automatic maintenance'
          assert_bundle_contains 'Every voter bounds its local journal'
          assert_bundle_contains 'Claim, revalidate, then consume'
          assert_bundle_contains 'docs-python-session-claim-v1'
          assert_bundle_contains 'claim_consumer_session'
          assert_bundle_contains 'adr/0029-stream-session-fenced-consumption.md'
          assert_bundle_contains 'Replicated Stream state services'
          assert_bundle_contains 'adr/0035-stream-state-services.md'
          assert_bundle_contains 'end-to-end Regional Stream SDK guide'
          assert_bundle_contains 'Producer + transaction'
          assert_bundle_contains 'Compaction + tier'
          assert_bundle_contains 'Capture + replication'
          assert_bundle_contains 'Consumer + superstream'
          assert_bundle_contains 'append_idempotent'
          assert_bundle_contains 'fetch_superstream'
          assert_bundle_contains 'Replicated time and size retention'
          assert_bundle_contains 'Regional Stream SDK'
          assert_bundle_contains 'Regional Queue SDK'
          assert_bundle_contains 'Lease, retry, dead-letter, redrive, and settle'
          assert_bundle_contains 'docs-python-redrive-v1'
          assert_bundle_contains 'Regional Cache SDK'
          assert_bundle_contains 'Typed values, CAS, transaction, fencing, and expiry survive leader loss.'
          assert_bundle_contains 'docs-python-cache-maintain-v1'
          assert_bundle_contains 'docs-python-cache-get-v1'
          assert_bundle_contains 'docs-python-cache-batch-v1'
          assert_bundle_contains 'Committed access and atomic batches'
          assert_bundle_contains 'adr/0032-regional-cache-eviction-and-access-batches.md'
          assert_bundle_contains 'Backup, PITR, and changes share the replicated history.'
          assert_bundle_contains 'docs-python-cache-bitmap-v1'
          assert_bundle_contains 'docs-python-cache-multiplex-presence-v1'
          assert_bundle_contains 'observed local-file microseconds'
          assert_bundle_contains 'adr/0034-cache-state-services-and-cold-read-tier.md'
          assert_bundle_contains 'Regional Event Bus SDK'
          assert_bundle_contains 'manage schemas and connectors'
          assert_bundle_contains 'docs-python-bus-ack-v1'
          assert_bundle_contains 'Deliver directly to Epoch Queue and Stream'
          assert_bundle_contains 'SubscriptionTarget.queue'
          assert_bundle_contains 'SubscriptionTarget.stream'
          assert_bundle_contains 'EPOCH_REGIONAL_EPOCH_TARGET_DELIVERY_INTERVAL_MS'
          assert_bundle_contains 'adr/0031-leader-owned-epoch-target-delivery.md'
          assert_bundle_contains 'Receive and verify a signed webhook'
          assert_bundle_contains 'VerifyWebhookSignature'
          assert_bundle_contains 'WebhookSignatures.verify'
          assert_bundle_contains 'verify_webhook_signature'
          assert_bundle_contains 'EPOCH_REGIONAL_WEBHOOK_SIGNING_KEYS_PATH'
          assert_bundle_contains 'adr/0030-leader-owned-signed-webhook-delivery.md'
          assert_bundle_contains 'Deliver to an authenticated managed target'
          assert_bundle_contains 'EPOCH_REGIONAL_MANAGED_TARGET_SECRETS_PATH'
          assert_bundle_contains 'SubscriptionTarget.apiDestination'
          assert_bundle_contains 'SubscriptionTarget.api_destination'
          assert_bundle_contains 'Commit and inspect integration state'
          assert_bundle_contains 'register_schema'
          assert_bundle_contains 'IntegrationState'
          assert_bundle_contains 'integration_state'
          assert_bundle_contains 'adr/0037-event-integration-platform.md'
          assert_bundle_contains 'Deploy and operate Epoch'
          assert_bundle_contains 'Verify release artifacts'
          assert_bundle_contains 'Epoch never publishes'
          assert_bundle_contains 'gh attestation verify'
          assert_bundle_contains 'RELEASE_ARTIFACTS.md'
          assert_bundle_contains 'adr/0041-tag-only-oci-supply-chain.md'
          assert_bundle_contains 'Run resumable fault evidence'
          assert_bundle_contains 'Ed25519-signed canonical manifest'
          assert_bundle_contains 'tests/soak/epoch_soak.py'
          assert_bundle_contains 'SOAK_TESTING.md'
          assert_bundle_contains 'Regional backup and restore'
          assert_bundle_contains 'EPBKAE01'
          assert_bundle_contains 'Tablet leaders do not need to be co-located with the Catalog leader.'
          assert_bundle_contains 'REGIONAL_BACKUP_RESTORE.md'
          assert_bundle_contains 'Guarded data-plane upgrades'
          assert_bundle_contains 'WaitingForBackup → Preflight → Draining → Updating → Verifying'
          assert_bundle_contains 'platform.epoch.dev/upgrade-owner=epoch'
          assert_bundle_contains 'GUARDED_UPGRADES.md'
          assert_bundle_contains 'Learner-first voter replacement'
          assert_bundle_contains 'target_voter_node_ids'
          assert_bundle_contains 'catalog_planned_voter_replacement_catches_up_finalizes_and_reopens'
          assert_bundle_contains 'VOTER_REPLACEMENT.md'
          assert_bundle_contains 'Epoch-Connector-Position'
          assert_bundle_contains 'S3-compatible/Azure/GCS objects'
          assert_bundle_contains 'Only complete transactions advance.'
          assert_bundle_contains 'The replicated Epoch cursor is authoritative.'
          assert_bundle_contains 'SOURCE_CONNECTORS.md'
          assert_bundle_contains 'adr/0040-initial-source-adapter-checkpoint-coupling.md'
          assert_bundle_contains 'Kubernetes installation and lifecycle'
          assert_bundle_contains 'adr/0038-product-runtime-closure.md'
          assert_bundle_contains 'Prove the live managed lifecycle'
          assert_bundle_contains 'one compacted-log voter replacement'
          assert_bundle_contains 'KUBERNETES_ALPHA_EXIT.md'
          assert_bundle_contains 'Checkpoint, compact, catch up, and reopen'
          assert_bundle_contains 'retained_log_first_index'
          assert_bundle_contains 'Multi-tablet operations'
          release_version="$(cat VERSION)"
          assert_bundle_contains "v${release_version} release notes"
          if grep -Eq '(src|href)="/assets/' console/dist/index.html; then
            echo 'build contains an asset URL outside /epoch/' >&2
            exit 1
          fi
          if grep -REq --include='*.js' --include='*.css' '/healthz|Refresh node' console/dist/assets; then
            echo 'docs-only build contains the live console runtime' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: console/dist

  docs-quickstarts:
    name: Execute displayed SDK quickstarts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install native Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake libcurl4-openssl-dev

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum

      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up pinned Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: sdk/java/pom.xml

      - name: Execute the exact published source
        run: bash tests/integration/docs-quickstarts.sh

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, docs-quickstarts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
