name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust format, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy
          --component rustfmt
      - name: Install native Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake libcurl4-openssl-dev
      - name: Install checksum-pinned protoc
        run: |
          protoc_root="${RUNNER_TEMP}/protoc-35.1"
          ./scripts/install-protoc.sh "$protoc_root"
          echo "${protoc_root}/bin" >> "$GITHUB_PATH"
      - name: Verify pinned protoc
        run: test "$(protoc --version)" = "libprotoc 35.1"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - name: Run persistent three-process consensus crash smoke
        env:
          EPOCH_CONSENSUS_PROCESS_ARTIFACT_DIR: ${{ runner.temp }}/epoch-consensus-process
        run: make test-consensus-process
      - name: Upload consensus process failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consensus-process-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/epoch-consensus-process
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo build --locked --workspace --all-targets --all-features
      - name: Reject Rust documentation warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps
      - name: Restore locked-source cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit-0.22.2/bin/cargo-audit
          key: cargo-audit-source-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-v0.22.2
      - name: Build pinned cargo-audit from locked source
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install cargo-audit
          --version 0.22.2
          --locked
          --root "${RUNNER_TEMP}/cargo-audit-0.22.2"
      - name: Verify pinned cargo-audit
        run: |
          echo "${RUNNER_TEMP}/cargo-audit-0.22.2/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/cargo-audit-0.22.2/bin/cargo-audit" --version \
            | grep -Eq '^cargo-audit(-audit)? 0\.22\.2$'
      - name: Audit Rust dependencies
        # The only temporary exception is raft's unmaintained fxhash dependency;
        # ADR-0003 stays Proposed until the dependency decision is accepted.
        run: cargo audit --deny warnings --ignore RUSTSEC-2025-0057

  go-contracts:
    name: Go SDK and Protobuf contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - name: Install pinned Buf CLI
        run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0
      - name: Lint workflows and shell scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
          shellcheck scripts/*.sh tests/integration/*.sh
      - name: Verify synchronized release metadata
        run: ./scripts/check-release-version.sh
      - name: Check Go formatting
        run: |
          mapfile -t go_files < <(find control operator sdk/go console/src/quickstarts -type f -name '*.go' 2>/dev/null)
          if (( ${#go_files[@]} > 0 )); then
            unformatted="$(gofmt -l "${go_files[@]}")"
            test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
          fi
      - run: buf lint
      - name: Reject stale generated bindings
        run: |
          buf generate
          git diff --exit-code -- sdk/go/gen
          test -z "$(git status --porcelain --untracked-files=all -- sdk/go/gen)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Render and validate Kubernetes operator resources
        run: make kubernetes-config
      - name: Compile displayed Go quickstart
        run: go build -trimpath -o /tmp/epoch-go-quickstart ./console/src/quickstarts/quickstart.go

  python:
    name: Python format, lint, test, package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install mypy==2.1.0 ruff==0.15.19
      - run: >-
          ruff format --check sdk/python tests/soak tests/integration/*.py
          console/src/quickstarts/quickstart.py
      - run: >-
          ruff check sdk/python tests/soak tests/integration/*.py
          console/src/quickstarts/quickstart.py
      - name: Compile and type-check displayed Python quickstart
        run: |
          python -m py_compile console/src/quickstarts/quickstart.py
          PYTHONPATH=sdk/python/src mypy --strict console/src/quickstarts/quickstart.py
      - name: Run Python SDK tests
        run: PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests -v
      - name: Run resumable soak evidence tests
        run: python -m unittest discover -s tests/soak -p 'test_*.py' -v
      - name: Run Kubernetes campaign contract tests
        run: >-
          PYTHONPATH=tests/integration python -m unittest
          tests/integration/test_kubernetes_alpha_exit.py -v
      - name: Build an installable SDK wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/epoch-python-wheel sdk/python

  java:
    name: Java format, lint, test, package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: sdk/java/pom.xml
      - run: sdk/java/mvnw --file sdk/java/pom.xml --batch-mode --no-transfer-progress verify
      - name: Compile displayed Java quickstart
        run: |
          sdk/java/mvnw --file sdk/java/pom.xml --batch-mode --no-transfer-progress \
            dependency:build-classpath -Dmdep.outputFile=target/runtime-classpath.txt
          mkdir -p sdk/java/target/docs-quickstart
          javac --release 25 -Xlint:all -Werror \
            -cp "sdk/java/target/classes:$(cat sdk/java/target/runtime-classpath.txt)" \
            -d sdk/java/target/docs-quickstart \
            console/src/quickstarts/Quickstart.java

  web:
    name: Console format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

  integration:
    name: Cross-language standalone and docs smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [rust, go-contracts, python, java]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install native Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake libcurl4-openssl-dev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: sdk/java/pom.xml
      - run: bash tests/integration/smoke.sh
      - name: Execute the exact displayed SDK quickstarts
        run: bash tests/integration/docs-quickstarts.sh

  connector-conformance:
    name: Source connector conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install native Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake libcurl4-openssl-dev
      - name: Validate connector service topology
        run: docker compose -f deploy/compose/docker-compose.connectors.yml config --quiet
      - name: Start pinned connector services
        run: >-
          docker compose -f deploy/compose/docker-compose.connectors.yml
          up --detach --wait minio postgres mysql kafka
      - name: Create object-store conformance bucket
        run: >-
          docker compose -f deploy/compose/docker-compose.connectors.yml
          run --rm minio-init
      - name: Run live object, CDC, and Kafka contracts
        run: >-
          cargo test --locked -p epoch-node source_adapters --lib --
          --ignored --nocapture --test-threads=1
      - name: Capture connector service logs
        if: failure()
        run: >-
          docker compose -f deploy/compose/docker-compose.connectors.yml
          logs --no-color > /tmp/connector-conformance.log
      - name: Upload connector failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connector-conformance
          path: /tmp/connector-conformance.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop connector services
        if: always()
        run: >-
          docker compose -f deploy/compose/docker-compose.connectors.yml
          down --volumes --remove-orphans

  kubernetes-alpha-exit:
    name: Live Kubernetes alpha-exit lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-pinned Kind and kubectl
        run: |
          tools_dir="${RUNNER_TEMP}/epoch-kubernetes-tools"
          mkdir -p "$tools_dir"
          curl --fail --silent --show-error --location \
            --output "$tools_dir/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  $tools_dir/kind" \
            | sha256sum --check --strict
          curl --fail --silent --show-error --location \
            --output "$tools_dir/kubectl" \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
          echo "cfda68cba5848bc3b6c6135ae2f20ba2c78de20059f68789c090166d6abc3e2c  $tools_dir/kubectl" \
            | sha256sum --check --strict
          chmod 0755 "$tools_dir/kind" "$tools_dir/kubectl"
          echo "$tools_dir" >> "$GITHUB_PATH"
      - name: Run exact-source four-node managed lifecycle
        run: >-
          tests/integration/kubernetes_alpha_exit.py
          --cluster-name epoch-alpha-exit-ci
          --evidence-dir "${RUNNER_TEMP}/epoch-kubernetes-alpha-exit-evidence"
      - name: Upload Kubernetes lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubernetes-alpha-exit-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/epoch-kubernetes-alpha-exit-evidence
          if-no-files-found: error
          retention-days: 30

  container:
    name: Container and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - run: docker compose -f deploy/compose/docker-compose.yml config --quiet
      - run: docker compose -f deploy/compose/docker-compose.consensus-probe.yml config --quiet
      - run: docker compose -f deploy/compose/docker-compose.regional.yml config --quiet
      - run: docker compose -f deploy/compose/docker-compose.connectors.yml config --quiet
      - name: Build the exact non-publishing OCI image set
        run: |
          version="$(cat VERSION)"
          for component in node control operator cli; do
            docker build \
              --file "deploy/docker/Dockerfile.${component}" \
              --build-arg "EPOCH_VERSION=${version}" \
              --build-arg "VCS_REF=${GITHUB_SHA}" \
              --tag "epoch/${component}:ci" .
          done
      - name: Inspect non-root runtime and OCI metadata
        run: |
          version="$(cat VERSION)"
          ./scripts/inspect-oci-image.sh epoch/node:ci "$version" "$GITHUB_SHA" /usr/local/bin/epoch-node "Epoch node"
          ./scripts/inspect-oci-image.sh epoch/control:ci "$version" "$GITHUB_SHA" /usr/local/bin/epoch-control "Epoch control plane"
          ./scripts/inspect-oci-image.sh epoch/operator:ci "$version" "$GITHUB_SHA" /usr/local/bin/epoch-operator "Epoch operator"
          ./scripts/inspect-oci-image.sh epoch/cli:ci "$version" "$GITHUB_SHA" /usr/local/bin/epoch "Epoch CLI"
      - name: Prove OCI inspection fails closed
        run: tests/integration/oci-image-inspection.sh
      - name: Generate node SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: epoch/node:ci
          format: spdx-json
          output-file: /tmp/epoch-node.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate control SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: epoch/control:ci
          format: spdx-json
          output-file: /tmp/epoch-control.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate operator SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: epoch/operator:ci
          format: spdx-json
          output-file: /tmp/epoch-operator.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate CLI SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: epoch/cli:ci
          format: spdx-json
          output-file: /tmp/epoch-cli.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Validate and upload PR SBOM evidence
        run: |
          for sbom in /tmp/epoch-*.spdx.json; do
            jq -e '.spdxVersion | startswith("SPDX-")' "$sbom" >/dev/null
            jq -e '.packages | length > 0' "$sbom" >/dev/null
          done
      - name: Upload OCI inspection evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-sboms-${{ github.run_attempt }}
          path: /tmp/epoch-*.spdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Run accelerated resumable four-profile fault campaign
        env:
          EPOCH_REGIONAL_IMAGE: epoch/node:ci
          EPOCH_REGIONAL_USE_EXISTING_IMAGE: "1"
        run: |
          python3 tests/soak/epoch_soak.py keygen \
            --output "${RUNNER_TEMP}/epoch-soak-signing-key.pem"
          python3 tests/soak/epoch_soak.py run \
            --profile accelerated \
            --state-dir "${RUNNER_TEMP}/epoch-soak-evidence" \
            --signing-key "${RUNNER_TEMP}/epoch-soak-signing-key.pem"
          python3 tests/soak/epoch_soak.py verify \
            --manifest "${RUNNER_TEMP}/epoch-soak-evidence/evidence.json" \
            --public-key "${RUNNER_TEMP}/epoch-soak-evidence/evidence-public.pem"
      - name: Upload accelerated fault evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accelerated-soak-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/epoch-soak-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Remove ephemeral evidence signing key
        if: always()
        run: rm -f -- "${RUNNER_TEMP}/epoch-soak-signing-key.pem"
      - name: Prove three-container consensus probe failover and catch-up
        env:
          EPOCH_PROBE_ARTIFACT_DIR: ${{ runner.temp }}/epoch-consensus-probe
          EPOCH_PROBE_IMAGE: epoch/node:ci
          EPOCH_PROBE_USE_EXISTING_IMAGE: "1"
        run: bash tests/integration/consensus-probe.sh
      - name: Prove typed Stream fixed-voter majority, failover, and SIGKILL replay
        env:
          EPOCH_TABLET_ARTIFACT_DIR: ${{ runner.temp }}/epoch-stream-tablet
          EPOCH_PROBE_IMAGE: epoch/node:ci
          EPOCH_TABLET_USE_EXISTING_IMAGE: "1"
        run: bash tests/integration/stream-tablet.sh
      - name: Prove typed Queue leases, failover, DLQ/redrive, and SIGKILL replay
        env:
          EPOCH_QUEUE_TABLET_ARTIFACT_DIR: ${{ runner.temp }}/epoch-queue-tablet
          EPOCH_PROBE_IMAGE: epoch/node:ci
          EPOCH_QUEUE_TABLET_USE_EXISTING_IMAGE: "1"
        run: bash tests/integration/queue-tablet.sh
      - name: Prove typed Cache CAS, transactions, TTL, fencing, failover, and SIGKILL replay
        env:
          EPOCH_CACHE_TABLET_ARTIFACT_DIR: ${{ runner.temp }}/epoch-cache-tablet
          EPOCH_PROBE_IMAGE: epoch/node:ci
          EPOCH_CACHE_TABLET_USE_EXISTING_IMAGE: "1"
        run: bash tests/integration/cache-tablet.sh
      - name: Prove Event Bus ingress/outbox settlement, failover, and SIGKILL recovery
        env:
          EPOCH_BUS_TABLET_ARTIFACT_DIR: ${{ runner.temp }}/epoch-bus-tablet
          EPOCH_PROBE_IMAGE: epoch/node:ci
          EPOCH_BUS_TABLET_USE_EXISTING_IMAGE: "1"
        run: bash tests/integration/bus-tablet.sh
      - name: Prove mounted local durability across container replacement
        run: |
          wait_for_health() {
            for _ in {1..100}; do
              if curl --fail --silent --show-error http://127.0.0.1:17661/healthz >/dev/null; then
                return 0
              fi
              sleep 0.1
            done
            docker logs epoch-node-ci-smoke
            return 1
          }

          wal_segment_count() {
            docker exec epoch-node-ci-smoke sh -c \
              'set -- /var/lib/epoch/engine-wal/segment-*.wal; if [ ! -e "$1" ]; then echo 0; else echo "$#"; fi'
          }

          assert_wal_rotated() {
            minimum_count="$1"
            segment_count="$(wal_segment_count)"
            if [ "$segment_count" -lt "$minimum_count" ]; then
              echo "expected at least $minimum_count WAL segments, found $segment_count" >&2
              docker exec epoch-node-ci-smoke \
                find /var/lib/epoch/engine-wal -maxdepth 1 -type f -print >&2 || true
              return 1
            fi
            echo "$segment_count"
          }

          docker volume create epoch-node-ci-data >/dev/null
          docker run --detach --rm --name epoch-node-ci-smoke \
            --publish 127.0.0.1:17661:7601 \
            --volume epoch-node-ci-data:/var/lib/epoch \
            --env EPOCH_WAL_SEGMENT_BYTES=512 \
            epoch/node:ci
          wait_for_health
          curl --fail --silent --show-error --output /dev/null \
            --header 'content-type: application/json' \
            --data '{"partitions":1,"durability":"local_durable","max_records_per_partition":null}' \
            http://127.0.0.1:17661/v1/streams/audit
          curl --fail --silent --show-error --output /dev/null \
            --header 'content-type: application/json' \
            --data '{"envelope":{"id":"container-1","source":"ci","type":"audit.created","time_ms":1,"payload":{"ok":true}}}' \
            http://127.0.0.1:17661/v1/streams/audit/records
          curl --fail --silent --show-error --output /dev/null \
            --header 'content-type: application/json' \
            --data '{"durability":"local_durable","visibility_timeout_ms":30000,"max_messages":100,"retry":{"strategy":"fixed","initial_delay_ms":1000,"max_delay_ms":1000,"jitter_percent":0,"max_attempts":3,"max_age_ms":null},"dedupe_window_ms":null}' \
            http://127.0.0.1:17661/v1/queues/jobs
          curl --fail --silent --show-error --output /dev/null \
            --header 'content-type: application/json' \
            --data '{"id":"container-job-1","source":"ci","type":"job.created","time_ms":1,"payload":{"ok":true}}' \
            http://127.0.0.1:17661/v1/queues/jobs/messages
          segments_before_restart="$(assert_wal_rotated 2)"
          docker stop --timeout 10 epoch-node-ci-smoke

          docker run --detach --rm --name epoch-node-ci-smoke \
            --publish 127.0.0.1:17661:7601 \
            --volume epoch-node-ci-data:/var/lib/epoch \
            --env EPOCH_WAL_SEGMENT_BYTES=512 \
            epoch/node:ci
          wait_for_health
          records="$(curl --fail --silent --show-error \
            'http://127.0.0.1:17661/v1/streams/audit/records?partition=0&offset=0&limit=10')"
          grep -q '"id":"container-1"' <<<"$records"
          queue_counts="$(curl --fail --silent --show-error \
            'http://127.0.0.1:17661/v1/queues/jobs/counts')"
          grep -q '"ready":1' <<<"$queue_counts"
          segments_after_restart="$(assert_wal_rotated 2)"
          test "$segments_after_restart" -ge "$segments_before_restart"
      - name: Stop smoke container
        if: always()
        run: |
          docker stop --timeout 10 epoch-node-ci-smoke || true
          docker volume rm epoch-node-ci-data || true
      - name: Upload consensus probe failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consensus-probe-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/epoch-consensus-probe
            ${{ runner.temp }}/epoch-stream-tablet
            ${{ runner.temp }}/epoch-queue-tablet
            ${{ runner.temp }}/epoch-cache-tablet
            ${{ runner.temp }}/epoch-bus-tablet
            ${{ runner.temp }}/epoch-regional-runtime
          if-no-files-found: ignore
          retention-days: 7
