[workspace]
members = [
  "crates/epoch-core",
  "crates/epoch-storage",
  "crates/epoch-consensus",
  "crates/epoch-cache",
  "crates/epoch-stream",
  "crates/epoch-tablet",
  "crates/epoch-queue",
  "crates/epoch-bus",
  "crates/epoch-catalog",
  "crates/epoch-engine",
  "crates/epoch-node",
  "crates/epoch-cli",
  "crates/epoch-testkit",
  "crates/epoch-auth",
  "crates/epoch-compat",
]
resolver = "3"

[workspace.package]
version = "0.2.0-beta.4"
edition = "2024"
rust-version = "1.97"
authors = ["Epoch Contributors"]
license = "MIT"

[workspace.dependencies]
apache-avro = "=0.21.0"
amq-protocol = { version = "=10.6.3", default-features = false }
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.5"
flate2 = "1.1"
futures-util = "0.3"
hmac = "=0.13.0"
http = "1.3"
http-body-util = "0.1"
jsonschema = { version = "=0.49.9", default-features = false }
kafka-protocol = { version = "=0.18.0", default-features = false, features = ["broker", "client", "gzip", "zstd", "snappy", "lz4", "messages_enums"] }
lz4 = "1.28"
lz4_flex = "0.14"
parking_lot = "0.12"
percent-encoding = "2.3"
object_store = { version = "0.14.1", default-features = false, features = ["aws", "azure", "gcp"] }
mysql_async = { version = "0.37.0", default-features = false, features = ["default-rustls-ring", "binlog"] }
pgwire-replication = "0.4.0"
prost = "=0.11.9"
prost-reflect = { version = "=0.16.5", features = ["serde"] }
protox-parse = "=0.9.0"
rdkafka = { version = "0.39.0", default-features = false, features = ["cmake-build", "ssl-vendored", "tokio"] }
rcgen = "0.14.9"
raft = { git = "https://github.com/tikv/raft-rs.git", rev = "ad13f3d90780f53aea2488c6a4b76c0d334bf136", default-features = false, features = ["prost-codec"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.0"
slog = "=2.8.2"
snap = "1.1"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-postgres = "0.7"
tower-http = { version = "0.7", features = ["cors", "request-id", "trace"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v7"] }
zstd = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
