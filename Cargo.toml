[workspace]
members = [
  "crates/epoch-core",
  "crates/epoch-storage",
  "crates/epoch-consensus",
  "crates/epoch-cache",
  "crates/epoch-stream",
  "crates/epoch-tablet",
  "crates/epoch-queue",
  "crates/epoch-bus",
  "crates/epoch-catalog",
  "crates/epoch-engine",
  "crates/epoch-node",
  "crates/epoch-cli",
  "crates/epoch-testkit",
  "crates/epoch-auth",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.6"
edition = "2024"
rust-version = "1.97"
authors = ["Epoch Contributors"]
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.5"
flate2 = "1.1"
hmac = "=0.13.0"
http = "1.3"
http-body-util = "0.1"
lz4_flex = "0.14"
parking_lot = "0.12"
percent-encoding = "2.3"
prost = "=0.11.9"
raft = { git = "https://github.com/tikv/raft-rs.git", rev = "ad13f3d90780f53aea2488c6a4b76c0d334bf136", default-features = false, features = ["prost-codec"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.0"
slog = "=2.8.2"
snap = "1.1"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.7", features = ["cors", "request-id", "trace"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v7"] }
zstd = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
