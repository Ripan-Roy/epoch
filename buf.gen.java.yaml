version: v2
clean: true

managed:
  enabled: true
  override:
    - file_option: java_package_prefix
      value: io.epoch.sdk.gen
    - file_option: java_multiple_files
      value: true

plugins:
  - remote: buf.build/protocolbuffers/java:v35.1
    out: .
  - remote: buf.build/grpc/java:v1.84.0
    out: .
    opt:
      - '@generated=omit'
