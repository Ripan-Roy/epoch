syntax = "proto3";

package epoch.v1;

import "epoch/v1/common.proto";

option go_package = "epoch.local/epoch/gen/go/epoch/v1;epochv1";

// RegionalAdmin is the versioned boundary between managed Go reconciliation
// and a regional Rust control surface. It carries desired metadata only.
service RegionalAdminService {
  // ApplyResource idempotently creates or updates desired resource state.
  rpc ApplyResource(ApplyResourceRequest) returns (ApplyResourceResponse);
  // GetResource returns one resource by fully qualified name.
  rpc GetResource(GetResourceRequest) returns (GetResourceResponse);
  // ListResources returns a stable page of resources.
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
  // DeleteResource removes desired resource state idempotently.
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse);
  // BatchApplyResources atomically commits 1-128 desired resource changes.
  rpc BatchApplyResources(BatchApplyResourcesRequest) returns (BatchApplyResourcesResponse);
  // GetOperation returns one durable request-token outcome.
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  // WatchResourceChanges streams resumable, bounded change checkpoints.
  rpc WatchResourceChanges(WatchResourceChangesRequest) returns (stream WatchResourceChangesResponse);
}

message ApplyResourceRequest {
  string request_token = 1;
  ResourceName name = 2;
  ResourceSpec spec = 3;
  optional uint64 expected_generation = 4;
}

message ApplyResourceResponse {
  Resource resource = 1;
  bool created = 2;
  bool changed = 3;
  bool replayed = 4;
}

message GetResourceRequest {
  ResourceName name = 1;
}

message GetResourceResponse {
  Resource resource = 1;
}

message ListResourcesRequest {
  string organization = 1;
  string project = 2;
  string environment = 3;
  string namespace = 4;
  ResourceKind kind = 5;
  int32 page_size = 6;
  string page_token = 7;
  string owner = 8;
  string cost_center = 9;
  DataClassification classification = 10;
  map<string, string> tags = 11;
}

message ListResourcesResponse {
  repeated Resource resources = 1;
  string next_page_token = 2;
}

message DeleteResourceRequest {
  string request_token = 1;
  ResourceName name = 2;
  optional uint64 expected_generation = 3;
}

message DeleteResourceResponse {
  ResourceName name = 1;
  uint64 generation = 2;
  bool deleted = 3;
  bool replayed = 4;
}

message BatchApplyResource {
  ResourceName name = 1;
  ResourceSpec spec = 2;
  optional uint64 expected_generation = 3;
}

message BatchApplyResourcesRequest {
  string request_token = 1;
  repeated BatchApplyResource resources = 2;
}

message BatchApplyResourcesResponse {
  repeated ApplyResourceResponse results = 1;
  bool replayed = 2;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_PENDING = 1;
  OPERATION_STATE_SUCCEEDED = 2;
  OPERATION_STATE_FAILED = 3;
}

message GetOperationRequest {
  string request_token = 1;
  // affected_resources is required and must exactly match the durable
  // operation once it commits. This prevents cross-tenant token disclosure.
  repeated ResourceName affected_resources = 2;
}

message GetOperationResponse {
  string request_token = 1;
  uint64 proposal_id = 2;
  OperationState state = 3;
  repeated ResourceName affected_resources = 4;
  string failure_code = 5;
  string failure_message = 6;
  uint64 first_change_cursor = 7;
  uint64 last_change_cursor = 8;
}

enum ResourceChangeKind {
  RESOURCE_CHANGE_KIND_UNSPECIFIED = 0;
  RESOURCE_CHANGE_KIND_DESIRED_APPLIED = 1;
  RESOURCE_CHANGE_KIND_DESIRED_DELETED = 2;
  RESOURCE_CHANGE_KIND_STATUS_UPDATED = 3;
}

message ResourceChange {
  uint64 cursor = 1;
  ResourceChangeKind kind = 2;
  ResourceName name = 3;
  uint64 generation = 4;
}

message WatchResourceChangesRequest {
  uint64 after_cursor = 1;
  uint32 batch_size = 2;
  string organization = 3;
  string project = 4;
  string environment = 5;
  string namespace = 6;
  ResourceKind kind = 7;
}

message WatchResourceChangesResponse {
  uint64 earliest_cursor = 1;
  uint64 latest_cursor = 2;
  repeated ResourceChange changes = 3;
  // next_cursor is the inclusive scanned checkpoint to supply as after_cursor.
  // It may trail latest_cursor when another bounded page is immediately ready.
  uint64 next_cursor = 4;
}
