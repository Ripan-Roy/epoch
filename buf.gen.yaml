version: v2
clean: true

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: epoch.local/epoch/sdk/go/gen

plugins:
  - local: protoc-gen-go
    out: sdk/go/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: sdk/go/gen
    opt:
      - paths=source_relative
