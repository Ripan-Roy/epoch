[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "epoch-sdk"
version = "0.2.0b12"
description = "Official Python client for Epoch"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Epoch Contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
management = ["grpcio==1.84.0", "protobuf==7.35.1"]
management-dev = [
  "grpcio==1.84.0",
  "protobuf==7.35.1",
  "grpcio-tools==1.84.0",
  "grpc-stubs==1.53.0.6",
  "types-protobuf==7.35.1.20260906",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epoch_sdk = ["py.typed", "**/*.pyi"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/epoch_sdk/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
